name: Delphia Therapeutics
description: 'Delphia Therapeutics is a Cambridge, Massachusetts oncology biotechnology company pioneering
  "activation lethality," a precision-medicine approach that targets cancer cells'' vulnerability to
  oncogene overactivation by selectively over-activating cancer-linked signaling until tumor cells can
  no longer survive. Founded by oncology drug developers Kevin Marks, Bill Sellers, and Mike Dillon,
  the company launched with a $67 million Series A financing led by GV, with participation from Nextech
  Invest, Polaris Innovation Fund, and Alexandria Venture Investments. Delphia is a preclinical-stage
  drug developer and does not currently publish a public developer API, SDK, or developer portal.'
